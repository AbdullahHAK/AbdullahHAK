name: Refresh activity card

on:
  schedule:
    - cron: "0 20 * * *" # daily, 01:00 Pakistan time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: design/requirements.txt
      - run: pip install -r design/requirements.txt
      - run: python design/build.py
      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh activity card"
          git push
